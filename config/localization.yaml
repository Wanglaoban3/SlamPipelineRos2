/**:
    ros__parameters:
        use_sim_time: true

        points_topic: "/points_raw"
        imu_topic: "/imu/data"
        robot_odom_frame_id: "robot_odom"
        odom_child_frame_id: "base_link"

        use_imu: true
        invert_acc: false
        invert_gyro: false

        reg_method: "NDT_OMP"
        ndt_neighbor_search_method: "DIRECT7"
        ndt_resolution: 0.75

        downsample_resolution: 0.1

        # global map produced by hdl_graph_slam (mapping stage)
        globalmap_filename: "/root/data/globalmap.pcd"

        specify_init_pose: true
        init_pos_x: 0.0
        init_pos_y: 0.0
        init_pos_z: 0.0
        init_ori_w: 1.0
        init_ori_x: 0.0
        init_ori_y: 0.0
        init_ori_z: 0.0
        cool_time_duration: 0.5

        enable_robot_odometry_prediction: true

        status_max_correspondence_dist: 0.5
        status_max_valid_point_dist: 25.0
